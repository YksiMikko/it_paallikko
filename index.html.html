<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Päivä laboratorion IT-päällikkönä</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0F1720;
    --bg-panel:#161F29;
    --bg-card:#1C2733;
    --bg-card-2:#20303B;
    --border:#2B3946;
    --border-soft:#233240;
    --text:#E7EEF2;
    --text-muted:#8FA3B0;
    --green:#3DDC97;
    --amber:#F5A623;
    --red:#E85D5D;
    --cyan:#5EC8E8;
    --purple:#A78BE0;
  }
  *{ box-sizing:border-box; }
  html,body{ background:var(--bg); }
  body{
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.font-display{ font-family:'Space Grotesk',sans-serif; }
  .font-mono,.option-mono,code{ font-family:'IBM Plex Mono',monospace; }
  code{ background:rgba(94,200,232,0.12); color:var(--cyan); padding:0.05rem 0.35rem; border-radius:4px; font-size:0.85em; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  button:focus-visible, select:focus-visible, .tab-btn:focus-visible{
    outline:2px solid var(--cyan); outline-offset:2px;
  }
  .hidden{ display:none !important; }

  /* header */
  .app-header{
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, var(--bg-panel), var(--bg));
  }
  .gauge-label{ font-size:0.72rem; color:var(--text-muted); letter-spacing:0.01em; }
  .clock-value{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:1.5rem; letter-spacing:0.02em; }
  .ring-track{ stroke:var(--border); }
  .stress-track{ background:var(--border-soft); border-radius:999px; overflow:hidden; }
  #stressBarFill{ height:100%; border-radius:999px; transition:width .5s ease, background .5s ease; }

  /* tabs */
  .tab-btn{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:0.9rem;
    color:var(--text-muted);
    padding:0.65rem 1.1rem;
    border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .tab-btn:hover{ color:var(--text); }
  .tab-btn-active{ color:var(--text); border-bottom-color:var(--cyan); }

  /* layout */
  .tickets-layout{ display:grid; grid-template-columns:1fr; gap:1.25rem; }
  @media(min-width:900px){ .tickets-layout{ grid-template-columns:1.6fr 1fr; } }
  .panel-inner{ max-width:920px; margin:0 auto; }
  .panel-title{ font-size:1.15rem; font-weight:600; margin-bottom:0.9rem; }

  /* ticket card */
  .ticket-card{
    background:var(--bg-card);
    border:1px solid var(--border-soft);
    border-left:3px solid var(--border);
    border-radius:10px;
    padding:1.25rem 1.35rem;
  }
  .ticket-card h3{ font-size:1.1rem; font-weight:600; margin:0.4rem 0 0.55rem; }
  .ticket-card p{ color:var(--text-muted); line-height:1.6; font-size:0.93rem; margin-bottom:0.9rem; }
  .ticket-badge{
    display:inline-block; font-size:0.7rem; font-weight:600;
    padding:0.2rem 0.55rem; border-radius:5px;
  }
  .badge-normal{ background:rgba(94,200,232,0.14); color:var(--cyan); }
  .badge-task{ background:rgba(61,220,151,0.14); color:var(--green); }
  .badge-urgent{ background:rgba(232,93,93,0.16); color:var(--red); }
  .incident-card{ border-left-color:var(--red); }

  .btn-primary{
    background:var(--cyan); color:#0B1620; font-weight:600; font-size:0.9rem;
    padding:0.6rem 1.1rem; border-radius:8px; transition:filter .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:active{ transform:translateY(1px); }

  /* option cards */
  .option-list{ display:flex; flex-direction:column; gap:0.55rem; margin:0.7rem 0; }
  .option-card{
    text-align:left; background:var(--bg-card-2); border:1px solid var(--border-soft);
    border-radius:8px; padding:0.7rem 0.9rem; font-size:0.9rem; color:var(--text);
    transition:border-color .15s ease, background .15s ease;
  }
  .option-card:hover:not(:disabled){ border-color:var(--cyan); background:#243541; }
  .option-card-wrong{ border-color:var(--red); background:rgba(232,93,93,0.08); }
  .option-card-text{ display:block; }

  /* feedback */
  .feedback-box{
    border-radius:8px; padding:0.75rem 0.95rem; font-size:0.88rem; line-height:1.55;
    margin:0.7rem 0; border:1px solid var(--border-soft);
  }
  .feedback-box p{ margin:0; color:inherit; }
  .feedback-box p + p{ margin-top:0.5rem; }
  .feedback-good{ background:rgba(61,220,151,0.1); border-color:rgba(61,220,151,0.35); color:#BFF3DC; }
  .feedback-bad{ background:rgba(232,93,93,0.1); border-color:rgba(232,93,93,0.35); color:#F6CACA; }
  .feedback-meh{ background:rgba(245,166,35,0.1); border-color:rgba(245,166,35,0.35); color:#FBDFA8; }
  .feedback-timeout{ font-weight:600; margin-bottom:0.4rem !important; }
  .hint-ok{ color:var(--green); font-size:0.9rem; font-weight:500; }

  /* incident timer */
  .timer-track{ height:5px; background:var(--border-soft); border-radius:999px; overflow:hidden; margin-bottom:0.9rem; }
  .timer-fill{ height:100%; width:100%; background:var(--amber); transition:width .2s linear; }

  /* side box / log */
  .side-box{ background:var(--bg-card); border:1px solid var(--border-soft); border-radius:10px; padding:1rem 1.1rem; margin-bottom:1rem; }
  .side-box-title{ font-size:0.78rem; color:var(--text-muted); margin-bottom:0.25rem; }
  .side-box-value{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1.2rem; }
  .log-list{ display:flex; flex-direction:column; gap:0.65rem; max-height:320px; overflow-y:auto; }
  .log-entry{ border-bottom:1px solid var(--border-soft); padding-bottom:0.6rem; font-size:0.82rem; }
  .log-time{ font-family:'IBM Plex Mono',monospace; color:var(--cyan); font-size:0.78rem; margin-right:0.4rem; }
  .log-text{ color:var(--text); }
  .log-deltas{ display:flex; gap:0.5rem; margin-top:0.3rem; flex-wrap:wrap; }
  .delta{ font-size:0.74rem; font-weight:600; padding:0.05rem 0.4rem; border-radius:4px; }
  .delta-pos{ color:var(--green); background:rgba(61,220,151,0.1); }
  .delta-neg{ color:var(--red); background:rgba(232,93,93,0.1); }
  .log-empty{ color:var(--text-muted); font-size:0.85rem; }
  .empty-state{ color:var(--text-muted); font-size:0.92rem; padding:1.5rem 0; text-align:center; }

  /* task steps */
  .task-step{ background:var(--bg-card); border:1px solid var(--border-soft); border-radius:10px; padding:1.1rem 1.25rem; margin-top:1.1rem; }
  .task-step h4{ font-size:1rem; font-weight:600; margin-bottom:0.5rem; }
  .task-step-desc{ color:var(--text-muted); font-size:0.9rem; line-height:1.6; margin-bottom:0.4rem; }

  /* network diagram */
  .network-diagram-wrap{ background:var(--bg-card); border:1px solid var(--border-soft); border-radius:10px; padding:1rem; }
  .node-box{ fill:#22323F; stroke:var(--border); stroke-width:1.5; }
  .node-box-fw{ fill:#2A2033; stroke:#7A5AE0; stroke-width:1.5; }
  .node-box-office{ fill:#1E2A33; stroke:var(--cyan); stroke-width:1.5; opacity:0.9; }
  .node-box-mw{ fill:#2A2820; stroke:var(--purple); stroke-width:1.5; }
  .node-box-device{ fill:#1E2E27; stroke:var(--green); stroke-width:1.5; }
  .node-box-huolto{ fill:#2A2420; stroke:var(--amber); stroke-width:1.5; opacity:0.9; }
  .vlan-box{ fill:rgba(94,200,232,0.04); stroke:var(--border); stroke-width:1.5; stroke-dasharray:4 4; }
  .vlan-title{ fill:var(--cyan); font-size:13px; font-family:'Space Grotesk',sans-serif; font-weight:600; }
  .node-label{ fill:var(--text); font-size:13px; font-family:'Inter',sans-serif; }
  .node-label-sm{ fill:var(--text-muted); font-size:11px; font-family:'IBM Plex Mono',monospace; }
  .legend{ display:flex; gap:1rem; flex-wrap:wrap; margin-top:0.8rem; font-size:0.78rem; color:var(--text-muted); }
  .legend-dot{ display:inline-block; width:8px; height:8px; border-radius:999px; margin-right:0.35rem; }

  /* HL7 explainer */
  .hl7-explainer{ display:flex; align-items:stretch; gap:0.9rem; background:var(--bg-card); border:1px solid var(--border-soft); border-radius:10px; padding:1.1rem; flex-wrap:wrap; }
  .hl7-explainer-card{ flex:1; min-width:220px; }
  .hl7-explainer-icon{ font-size:1.5rem; margin-bottom:0.3rem; }
  .hl7-explainer-label{ font-family:'Space Grotesk',sans-serif; font-weight:600; margin-bottom:0.35rem; }
  .hl7-explainer-card p{ color:var(--text-muted); font-size:0.87rem; line-height:1.55; }
  .hl7-explainer-arrow{ align-self:center; font-size:1.3rem; color:var(--cyan); }

  /* HL7 raw message blocks */
  .hl7-msgs{ display:flex; gap:0.9rem; flex-wrap:wrap; margin-top:0.9rem; }
  .hl7-msg-block{ flex:1; min-width:260px; background:var(--bg-card-2); border:1px solid var(--border-soft); border-radius:10px; padding:0.85rem 0.95rem; }
  .hl7-msg-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:0.85rem; margin-bottom:0.55rem; color:var(--text); }
  .hl7-line{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; line-height:1.7; white-space:pre-wrap; word-break:break-all; }
  .hl7-seg{ font-weight:700; padding:0 0.15rem; border-radius:3px; margin-right:0.1rem; }
  .hl7-seg-msh{ color:var(--text-muted); }
  .hl7-seg-pid{ color:var(--cyan); background:rgba(94,200,232,0.12); }
  .hl7-seg-obr{ color:var(--amber); background:rgba(245,166,35,0.12); }
  .hl7-seg-obx{ color:var(--green); background:rgba(61,220,151,0.12); }
  .hl7-rest{ color:var(--text-muted); }

  /* mapping puzzle */
  .mapping-grid{ display:flex; flex-direction:column; gap:0.7rem; margin:0.8rem 0; }
  .mapping-row{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:0.7rem; background:var(--bg-card-2); border:1px solid var(--border-soft); border-radius:8px; padding:0.65rem 0.85rem; }
  @media(max-width:640px){ .mapping-row{ grid-template-columns:1fr; } .mapping-arrow{ transform:rotate(90deg); justify-self:start; } }
  .mapping-source-label{ font-size:0.88rem; font-weight:500; }
  .mapping-source-hint{ font-size:0.74rem; color:var(--text-muted); margin-top:0.25rem; font-family:'IBM Plex Mono',monospace; word-break:break-all; }
  .mapping-arrow{ color:var(--cyan); font-weight:600; }
  .mapping-select{
    background:var(--bg-panel); color:var(--text); border:1px solid var(--border-soft);
    border-radius:6px; padding:0.45rem 0.5rem; font-size:0.85rem; width:100%;
  }

  /* fade in */
  .fade-in{ animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .fade-in{ animation:none; } }

  /* end of day overlay */
  #endOfDayOverlay{
    position:fixed; inset:0; background:rgba(6,10,14,0.86); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; padding:1.25rem; z-index:50;
  }
  .end-card{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:14px;
    padding:1.75rem; max-width:560px; width:100%; max-height:88vh; overflow-y:auto;
  }
  .end-title{ font-size:1.4rem; font-weight:700; margin-bottom:0.6rem; }
  .end-text{ color:var(--text-muted); line-height:1.6; font-size:0.93rem; margin-bottom:0.6rem; }
  .end-text-muted{ font-style:italic; }
  .end-stats{ display:flex; gap:1rem; margin:1.1rem 0; }
  .end-stat{ flex:1; background:var(--bg-card); border:1px solid var(--border-soft); border-radius:10px; padding:0.9rem; text-align:center; }
  .end-stat-label{ font-size:0.78rem; color:var(--text-muted); margin-bottom:0.3rem; }
  .end-stat-value{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.6rem; }
  .end-log-title{ font-size:0.85rem; color:var(--text-muted); margin:1rem 0 0.5rem; }
  .end-log-list{ max-height:220px; }
</style>
</head>
<body>
<div id="app">

  <header class="app-header sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-lg font-semibold leading-tight">🧬 Päivä laboratorion IT-päällikkönä</h1>
        <p class="text-xs" style="color:var(--text-muted)">Kliinisen laboratorion IT-valvomo</p>
      </div>
      <div class="flex items-center gap-6">
        <div class="text-center">
          <div class="gauge-label">Työaika</div>
          <div class="clock-value" id="clockDisplay">08:00</div>
        </div>
        <div class="flex flex-col items-center">
          <div class="gauge-label mb-1">Toimintavarmuus</div>
          <div class="relative" style="width:56px;height:56px;">
            <svg width="56" height="56" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="26" fill="none" stroke-width="7" class="ring-track" />
              <circle id="uptimeRing" cx="32" cy="32" r="26" fill="none" stroke-width="7"
                stroke-linecap="round" transform="rotate(-90 32 32)" />
            </svg>
            <div class="absolute inset-0 flex items-center justify-center text-xs font-semibold" id="uptimeValue">100%</div>
          </div>
        </div>
        <div class="flex flex-col items-center" style="width:110px;">
          <div class="gauge-label mb-1">Stressitaso</div>
          <div class="stress-track w-full" style="height:9px;">
            <div id="stressBarFill" style="width:0%;background:#3DDC97;"></div>
          </div>
          <div class="text-xs mt-1 font-semibold" id="stressValue">0%</div>
        </div>
      </div>
    </div>
    <nav class="max-w-6xl mx-auto px-4 flex gap-1 overflow-x-auto">
      <button class="tab-btn tab-btn-active" data-tab="tickets">🎫 Tiketit / Tehtävälista</button>
      <button class="tab-btn" data-tab="verkko">🧭 Verkko ja Palomuuri</button>
      <button class="tab-btn" data-tab="hl7">✉️ Sanomaliikenne (HL7)</button>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <section id="panel-tickets" class="tab-panel"></section>
    <section id="panel-verkko" class="tab-panel hidden"></section>
    <section id="panel-hl7" class="tab-panel hidden"></section>
  </main>

</div>

<div id="endOfDayOverlay" class="hidden">
  <div class="end-card" id="endOfDayContent"></div>
</div>

<script>
// ===================== UTIL =====================

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function minutesToClock(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

// ===================== DATA: INCIDENTS =====================

const INCIDENT_POOL = [
  {
    id: 'tulostin',
    title: 'Tarraluuppitulostin ei vastaa',
    desc: 'Näytteenoton tarratulostin on jäänyt jumiin. Näytteitä ei voi tunnistaa ilman tarroja, ja jonotusaula alkaa täyttyä.',
    options: [
      { text: 'Käynnistä tulostin uudelleen ja tarkista paperirulla', quality: 'good', uptime: 4, stress: 2,
        feedback: 'Hyvä refleksi! Suurin osa tulostinongelmista ratkeaa perusvianmäärityksellä — uudelleenkäynnistys ja tarkistus veivät vain muutaman minuutin.' },
      { text: 'Tilaa heti uusi tulostin varmuuden vuoksi', quality: 'meh', uptime: 1, stress: 5,
        feedback: 'Uusi tulostin saapuu joskus ensi viikolla, mutta se ei auta juuri nyt. Kannattaa aina kokeilla nopeaa vianmääritystä ennen isompia päätöksiä.' },
      { text: 'Jätä huomiotta, ehtii huomennakin', quality: 'bad', uptime: -10, stress: 8,
        feedback: 'Näytteitä kertyy tunnistamattomina, ja vaara sekaantumisesta kasvaa. Tarraongelmat vaikuttavat suoraan potilasturvallisuuteen — niitä ei voi jättää odottamaan.' },
    ],
  },
  {
    id: 'hl7versio',
    title: 'Analysaattori lähettää tuloksia väärässä muodossa',
    desc: 'Hematologia-analysaattori alkoi yhtäkkiä lähettää tuloksia HL7-muodossa, jota laboratoriojärjestelmä ei osaa tulkita.',
    options: [
      { text: 'Tarkista laitteen HL7-versioasetus ja korjaa se järjestelmän odottamaksi', quality: 'good', uptime: 5, stress: 3,
        feedback: 'Juurisyy löytyi ja korjattiin — laite ja järjestelmä puhuvat taas samaa kieltä. Tämä on täsmälleen oikea kohta korjata, ei kumpikaan pää.' },
      { text: 'Käynnistä koko labran verkko uudelleen', quality: 'bad', uptime: -14, stress: 10,
        feedback: 'Koko verkon uudelleenkäynnistys pudotti kaikki laitteet hetkeksi pois linjoilta eikä silti korjannut sanoman muotovirhettä. Ylimitoitettu toimenpide, joka aiheutti turhan katkoksen.' },
      { text: 'Pyydä bioanalyytikkoja kirjaamaan tulokset käsin toistaiseksi', quality: 'meh', uptime: -2, stress: 4,
        feedback: 'Väliaikaisratkaisu pitää työt liikkeessä, mutta juurisyy jää korjaamatta ja virhe todennäköisesti toistuu pian uudelleen.' },
    ],
  },
  {
    id: 'huoltopyynto',
    title: 'Huoltoyhtiö pyytää laajempaa etäyhteyttä "nopeuden vuoksi"',
    desc: 'Analysaattorin huoltoyritys soittaa ja pyytää pääsyä koko labran verkkoon, jotta "asiat sujuisivat jatkossa nopeammin".',
    options: [
      { text: 'Kieltäydy ja tarjoa edelleen rajattu, aikarajoitettu VPN-pääsy vain kyseiseen laitteeseen', quality: 'good', uptime: 3, stress: 2,
        feedback: 'Oikea ratkaisu: pääsy annetaan aina vain sen verran ja sen ajan kuin tehtävä vaatii ("least privilege"). Yhden laitteen huoltoyhteys ei edellytä pääsyä koko verkkoon.' },
      { text: 'Myönnä pyyntö, kunhan työ nopeutuu', quality: 'bad', uptime: -8, stress: 6,
        feedback: 'Laaja pääsy ulkopuoliselle toimijalle kasvattaa koko laboratorion verkon hyökkäyspintaa merkittävästi yhden analysaattorin huollon vuoksi. Tietoturvariski ei ole sen arvoinen.' },
      { text: 'Katkaise huollon etäyhteys kokonaan', quality: 'meh', uptime: -4, stress: 4,
        feedback: 'Turvallista, mutta ylimitoitettua — nyt huolto ei pääse tekemään lainkaan diagnostiikkaa ja vikatilanteet venyvät jatkossa pidemmiksi.' },
    ],
  },
  {
    id: 'runkoverkko',
    title: 'Ulkoverkon yhteys pätkii hetkittäin',
    desc: 'Laboratorion laitteet tipahtelevat verkosta muutaman sekunnin ajaksi kerrallaan. Vika voi olla omassa laiteverkossa tai ulkoisessa operaattoriyhteydessä.',
    options: [
      { text: 'Selvitä ensin, näkyykö vika laajemmin, ja ilmoita asiasta verkko-operaattorille', quality: 'good', uptime: 3, stress: 2,
        feedback: 'Oikea järjestys: ensin rajataan vian laajuus, sitten ohjataan se oikealle taholle. Ulkoinen runkoyhteys ei kuulu laboratorion omalle IT:lle, mutta tieto ongelmasta kylläkin.' },
      { text: 'Yritä itse korjata verkko-operaattorin runkoyhteyden asetuksia', quality: 'bad', uptime: -6, stress: 9,
        feedback: 'Ulkoinen runkoyhteys on verkko-operaattorin vastuulla — omat korjausyritykset siellä voivat pahentaa tilannetta ja sekoittaa vianselvityksen.' },
      { text: 'Odota, että se korjaantuu itsestään', quality: 'meh', uptime: -3, stress: 3,
        feedback: 'Joskus hetkellinen pätkintä menee itsestään ohi, mutta ilman ilmoitusta vika voi jatkua tunnistamattomana pidempään kuin tarpeen.' },
    ],
  },
  {
    id: 'potilastiedot',
    title: 'Näytteen viivakoodi ei täsmää potilastietoihin',
    desc: 'Bioanalyytikko soittaa hälyttyneenä: näytteen viivakoodi ja järjestelmässä näkyvät potilastiedot eivät täsmää.',

function hl7SegClass(code) {
  const c = code.toLowerCase();
  if (c === 'msh') return 'hl7-seg-msh';
  if (c === 'pid') return 'hl7-seg-pid';
  if (c === 'obr') return 'hl7-seg-obr';
  if (c === 'obx') return 'hl7-seg-obx';
  return '';
}

function hl7MsgHtml(lines) {
  return lines.map((line) => {
    const pipeIdx = line.indexOf('|');
    const code = pipeIdx === -1 ? line : line.slice(0, pipeIdx);
    const rest = pipeIdx === -1 ? '' : line.slice(pipeIdx);
    return `<div class="hl7-line"><span class="hl7-seg ${hl7SegClass(code)}">${escapeHtml(code)}</span><span class="hl7-rest">${escapeHtml(rest)}</span></div>`;
  }).join('');
}

// ===================== STATE =====================

let state = null;

function newGame() {
  const chosenIncidents = shuffle(INCIDENT_POOL).slice(0, 6);
  let ic = 0;
  const beats = BEATS_DEF.map((b) => {
    if (b.type === 'incident') {
      const incident = chosenIncidents[ic++];
      return Object.assign({}, b, { incident: incident });
    }
    return Object.assign({}, b);
  });

  state = {
    beats: beats,
    beatIndex: 0,
    timeMin: 480,
    uptime: 100,
    stress: 0,
    activeTab: 'tickets',
    gameOver: false,
    task1: { ipChosen: null, ipCorrect: false, remoteChosen: null, remoteCorrect: false, done: false, wrongIpTries: [], wrongRemoteTries: [] },
    task2: { mapping: {}, done: false, lastErrors: [] },
    log: [],
    incidentAnswered: false,
    incidentChosenIndex: null,
    incidentTimedOut: false,
    incidentTimerId: null,
    incidentTimeLeft: 12,
  };
}

function currentBeat() {
  return state.beats[state.beatIndex];
}

function beatStartTime(index) {
  let t = 480;
  for (let i = 0; i < index; i++) t += state.beats[i].duration;
  return t;
}

function clamp(v) {
  return Math.max(0, Math.min(100, v));
}

function addLog(text, uptimeDelta, stressDelta) {
  state.log.unshift({
    time: minutesToClock(state.timeMin),
    text: text,
    uptimeDelta: uptimeDelta,
    stressDelta: stressDelta,
  });
}

function applyDeltas(uptimeDelta, stressDelta, text) {
  state.uptime = clamp(state.uptime + uptimeDelta);
  state.stress = clamp(state.stress + stressDelta);
  addLog(text, uptimeDelta, stressDelta);
}

function completeCurrentBeat(uptimeDelta, stressDelta, text) {
  applyDeltas(uptimeDelta, stressDelta, text);
  clearIncidentTimer();
  state.beatIndex++;
  if (state.beatIndex >= state.beats.length) {
    state.timeMin = 960;
    state.gameOver = true;
  } else {
    state.timeMin = beatStartTime(state.beatIndex);
    state.incidentAnswered = false;
    state.incidentChosenIndex = null;
    state.incidentTimedOut = false;
    state.incidentTimeLeft = 12;
    const b = currentBeat();
    if (b.type === 'task1' || b.type === 'task2') {
      state.activeTab = b.type === 'task1' ? 'verkko' : 'hl7';
    } else {
      state.activeTab = 'tickets';
    }
  }
  renderAll();
}

function clearIncidentTimer() {
  if (state.incidentTimerId) {
    clearInterval(state.incidentTimerId);
    state.incidentTimerId = null;
  }
}

function startIncidentTimer() {
  clearIncidentTimer();
  state.incidentTimeLeft = 12;
  state.incidentTimerId = setInterval(() => {
    state.incidentTimeLeft -= 0.2;
    if (state.incidentTimeLeft <= 0) {
      clearIncidentTimer();
      const beat = currentBeat();
      let worst = beat.incident.options[0];
      beat.incident.options.forEach((o) => { if (o.uptime < worst.uptime) worst = o; });
      answerIncident(beat.incident.options.indexOf(worst), true);
      return;
    }
    const bar = document.getElementById('incidentTimerBar');
    if (bar) bar.style.width = (state.incidentTimeLeft / 12 * 100) + '%';
  }, 200);
}

// ===================== ACTIONS =====================

function setActiveTab(tab) {
  state.activeTab = tab;
  renderAll();
}

function chooseIp(index) {
  if (state.task1.ipCorrect) return;
  const opt = NETWORK_IP_OPTIONS[index];
  state.task1.ipChosen = index;
  if (opt.correct) {
    state.task1.ipCorrect = true;
  } else if (state.task1.wrongIpTries.indexOf(index) === -1) {
    state.task1.wrongIpTries.push(index);
  }
  renderAll();
}

function chooseRemote(index) {
  if (state.task1.remoteCorrect) return;
  const opt = REMOTE_ACCESS_OPTIONS[index];
  state.task1.remoteChosen = index;
  if (opt.correct) {
    state.task1.remoteCorrect = true;
  } else if (state.task1.wrongRemoteTries.indexOf(index) === -1) {
    state.task1.wrongRemoteTries.push(index);
  }
  renderAll();
}

function finishTask1() {
  state.task1.done = true;
  completeCurrentBeat(8, -3, 'Uusi analysaattori kytkettiin laite-VLAN 30:een middlewaren kautta, ja huollolle avattiin aikarajoitettu, valvottu VPN-yhteys vain tähän laitteeseen.');
}

function setMapping(fieldId, value) {
  state.task2.mapping[fieldId] = value;
}

function verifyMapping() {
  const errors = [];
  HL7_SEGMENTS.forEach((f) => {
    const chosen = state.task2.mapping[f.id] || '';
    if (chosen !== f.correct) {
      errors.push({ field: f.id, message: f.wrongFeedback });
    }
  });
  state.task2.lastErrors = errors;
  if (errors.length === 0) {
    state.task2.done = true;
  } else {
    state.stress = clamp(state.stress + 2);
  }
  renderAll();
}

function finishTask2() {
  completeCurrentBeat(8, -2, 'Uusi asiakasyhteys muodostettiin — lähetteet (ORM^O01) ja tulosvastaukset (ORU^R01) kulkevat nyt oikein segmentti kerrallaan.');
}

function answerIncident(index, timedOut) {
  if (state.incidentAnswered) return;
  clearIncidentTimer();
  state.incidentAnswered = true;
  state.incidentChosenIndex = index;
  state.incidentTimedOut = !!timedOut;
  renderAll();
}

function continueAfterIncident() {
  const beat = currentBeat();
  const opt = beat.incident.options[state.incidentChosenIndex];
  let text = opt.feedback;
  if (state.incidentTimedOut) {
    text = 'Et ehtinyt päättää ajoissa, joten tilanne eteni itsestään huonoimmalla mahdollisella tavalla. ' + text;
  }
  completeCurrentBeat(opt.uptime, opt.stress, beat.incident.title + ': ' + text);
}

function continueFlavor(uptimeDelta, stressDelta, text) {
  completeCurrentBeat(uptimeDelta, stressDelta, text);
}

// ===================== RENDER: HEADER =====================

function uptimeColor(v) {
  if (v >= 70) return '#3DDC97';
  if (v >= 40) return '#F5A623';
  return '#E85D5D';
}

function stressColor(v) {
  if (v <= 30) return '#3DDC97';
  if (v <= 65) return '#F5A623';
  return '#E85D5D';
}

function renderHeader() {
  document.getElementById('clockDisplay').textContent = minutesToClock(state.timeMin);

  const pct = state.uptime;
  const r = 26;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - pct / 100);
  const ring = document.getElementById('uptimeRing');
  ring.style.strokeDasharray = c.toFixed(2);
  ring.style.strokeDashoffset = offset.toFixed(2);
  ring.style.stroke = uptimeColor(pct);
  document.getElementById('uptimeValue').textContent = Math.round(pct) + '%';

  const stressBar = document.getElementById('stressBarFill');
  stressBar.style.width = state.stress + '%';
  stressBar.style.background = stressColor(state.stress);
  document.getElementById('stressValue').textContent = Math.round(state.stress) + '%';

  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.classList.toggle('tab-btn-active', btn.dataset.tab === state.activeTab);
  });
}

function verdictFor(uptime, stress) {
  let title, text;
  if (uptime >= 85) {
    title = '🏆 Loistava päivä valvomossa!';
    text = 'Labra pyöri kuin öljytty kone koko päivän. Nopeat, harkitut päätökset pitivät sekä laitteet että potilasturvallisuuden kunnossa.';
  } else if (uptime >= 65) {
    title = '✅ Työpäivä selätetty';
    text = 'Päivä sujui pääosin hyvin, vaikka matkalla oli muutama säätöä vaatinut hetki. Labra toimi läpi päivän.';
  } else if (uptime >= 40) {
    title = '😅 Rytinällä mutta selvisit';
    text = 'Päivä oli rankka ja moni asia meni nipin napin — mutta labra pysyi pystyssä, ja jokainen virhe opetti jotain seuraavaa kertaa varten.';
  } else {
    title = '🔥 Labra kaatui pahasti tänään';
    text = 'Liian monta riskipäätöstä kasautui, ja toimintavarmuus romahti. Huomenna kannattaa palata perusasioihin: rajattu pääsy, nopea vianmääritys ja potilasturvallisuus ensin.';
  }
  let stressNote = '';
  if (stress >= 70) {
    stressNote = 'Oma jaksaminenkin alkoi olla koetuksella päivän aikana — huomenna kannattaa muistaa myös tauot.';
  } else if (stress <= 30) {
    stressNote = 'Pysyit rauhallisena koko päivän — hyvää itsensä johtamista kiireenkin keskellä.';
  }
  return { title: title, text: text, stressNote: stressNote };
}

function renderEndOfDay() {
  const overlay = document.getElementById('endOfDayOverlay');
  if (!state.gameOver) {
    overlay.classList.add('hidden');
    return;
  }
  overlay.classList.remove('hidden');
  const v = verdictFor(state.uptime, state.stress);
  document.getElementById('endOfDayContent').innerHTML = `
    <h2 class="end-title">${v.title}</h2>
    <p class="end-text">${v.text}</p>
    ${v.stressNote ? `<p class="end-text end-text-muted">${v.stressNote}</p>` : ''}
    <div class="end-stats">
      <div class="end-stat">
        <div class="end-stat-label">Toimintavarmuus</div>
        <div class="end-stat-value" style="color:${uptimeColor(state.uptime)}">${Math.round(state.uptime)}%</div>
      </div>
      <div class="end-stat">
        <div class="end-stat-label">Stressitaso</div>
        <div class="end-stat-value" style="color:${stressColor(state.stress)}">${Math.round(state.stress)}%</div>
      </div>
    </div>
    <div class="end-log-title">Päivän kulku</div>

      ${state.log.slice().reverse().map(logEntryHtml).join('')}

}

function handleClick(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const index = btn.dataset.index !== undefined ? parseInt(btn.dataset.index, 10) : null;

  switch (action) {
    case 'flavor-intro':
      continueFlavor(0, 0, 'Päivä alkoi rauhallisesti — kahvikuppi kädessä valvomo herää eloon.');
      break;
    case 'flavor-lunch':
      continueFlavor(0, -8, 'Lounastauko rauhoitti mieltä ennen iltapäivän ruuhkaa.');
      break;
    case 'flavor-report':
      continueFlavor(2, 3, 'Päivän yhteenveto kirjoitettiin ajallaan johtoryhmälle.');
      break;
    case 'goto-verkko':
      setActiveTab('verkko');
      break;
    case 'goto-hl7':
      setActiveTab('hl7');
      break;
    case 'choose-ip':
      chooseIp(index);
      break;
    case 'choose-remote':
      chooseRemote(index);
      break;
    case 'finish-task1':
      finishTask1();
      break;
    case 'verify-mapping':
      verifyMapping();
      break;
    case 'finish-task2':
      finishTask2();
      break;
    case 'answer-incident':
      answerIncident(index, false);
      break;
    case 'continue-incident':
      continueAfterIncident();
      break;
    case 'close-day':
      window.location.reload();
      break;
    default:
      break;
  }
}

function handleChange(e) {
  const sel = e.target.closest('[data-action="set-mapping"]');
  if (!sel) return;
  setMapping(sel.dataset.field, sel.value);
}

function initTabs() {
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
  });
}

function init() {
  newGame();
  initTabs();
  document.addEventListener('click', handleClick);
  document.addEventListener('change', handleChange);
  renderAll();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
